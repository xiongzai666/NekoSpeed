name: CI & Tag Release

on:
  push:
    branches: [ main, master, feat/**, fork/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk zip

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Cross-compile all platforms
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist/release

          targets=(
            "windows amd64 .exe"
            "windows arm64 .exe"
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for t in "${targets[@]}"; do
            read -r goos goarch ext <<<"$t"
            bin_name="nekospeed-${goos}-${goarch}${ext:-}"
            out_bin="dist/${bin_name}"
            echo "==> Building ${out_bin}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" -o "$out_bin" ./cmd/nekospeed

            pkg_name="nekospeed_${VERSION}_${goos}-${goarch}"
            stage="dist/.stage/${pkg_name}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp "$out_bin" "$stage/"
            cp README.md LICENSE "$stage/"

            if [ "$goos" = "windows" ]; then
              (cd dist/.stage && zip -q -r "../release/${pkg_name}.zip" "${pkg_name}")
              cp "$out_bin" "dist/release/${bin_name}"
            else
              (cd dist/.stage && tar czf "../release/${pkg_name}.tar.gz" "${pkg_name}")
            fi
          done

          rm -rf dist/.stage
          (cd dist/release && sha256sum * > SHA256SUMS.txt)

      - name: Publish Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/release/*
