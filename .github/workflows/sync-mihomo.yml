name: Sync Upstream & Mihomo Auto Release

on:
  schedule:
    # 每天北京时间 10:00 (02:00 UTC) 自动检查上游 KaWaIDeSuNe/NekoSpeed 代码更新与 MetaCubeX/mihomo 新版本
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '即使上游与 mihomo 无更新也强制重新构建并发布 Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync upstream KaWaIDeSuNe/NekoSpeed & check MetaCubeX/mihomo
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. 检查并同步上游仓库 KaWaIDeSuNe/NekoSpeed
          git remote add upstream https://github.com/KaWaIDeSuNe/NekoSpeed.git || true
          git fetch upstream main
          UPSTREAM_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "New commits in upstream KaWaIDeSuNe/NekoSpeed: $UPSTREAM_COUNT"
          UPSTREAM_UPDATED="false"
          if [ "$UPSTREAM_COUNT" -gt 0 ]; then
            echo "Merging $UPSTREAM_COUNT new commit(s) from upstream/main..."
            if ! git merge --no-edit upstream/main; then
              git merge --abort || true
              git push -f origin "upstream/main:refs/heads/sync/upstream-main"
              if [ "$(gh pr list --head sync/upstream-main --state open --json number --jq 'length')" = "0" ]; then
                gh pr create \
                  --head sync/upstream-main \
                  --base "${GITHUB_REF_NAME}" \
                  --title "chore(sync): manual conflict resolution needed for upstream/main" \
                  --body "Automatic merge of \`KaWaIDeSuNe/NekoSpeed\` (\`${UPSTREAM_COUNT}\` commit(s)) conflicted with fork changes. Refusing silent \`-X ours\` overwrite; please resolve conflicts manually." || true
              fi
              echo "::error::Upstream merge conflict detected; opened sync/upstream-main for manual review."
              exit 1
            fi
            UPSTREAM_UPDATED="true"
          fi
          echo "upstream_updated=$UPSTREAM_UPDATED" >> "$GITHUB_OUTPUT"
          echo "upstream_commits=$UPSTREAM_COUNT" >> "$GITHUB_OUTPUT"

          # 2. 检查上游 MetaCubeX/mihomo 最新稳定版 Release
          CURRENT=$(awk '/github.com\/metacubex\/mihomo / {print $2; exit}' go.mod)
          LATEST=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          echo "Current mihomo version in go.mod: $CURRENT"
          echo "Latest upstream mihomo release: $LATEST"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; then
            echo "needs_mihomo_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_mihomo_update=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$UPSTREAM_UPDATED" = "true" ] || { [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; } || [ "$FORCE_RELEASE" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check.outputs.should_release == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Java
        if: steps.check.outputs.should_release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.check.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Install CJK Fonts for Render Tests
        if: steps.check.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk zip

      - name: Upgrade mihomo dependency to latest
        if: steps.check.outputs.needs_mihomo_update == 'true' || steps.check.outputs.upstream_updated == 'true'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          go get "github.com/metacubex/mihomo@${LATEST}"
          go mod tidy
          sed -i -E "s|github.com/metacubex/mihomo v[0-9.]+|github.com/metacubex/mihomo ${LATEST}|g" README.md || true

      - name: Run Unit Tests
        if: steps.check.outputs.should_release == 'true'
        run: go test -v ./...

      - name: Commit & Push synced changes and compute Release Tag
        id: tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          LATEST="${{ steps.check.outputs.latest }}"
          DATE_STAMP=$(date -u +'%Y.%m.%d')
          TAG_NAME="v${DATE_STAMP}-${LATEST}"

          if [ -n "$(git status --porcelain go.mod go.sum README.md)" ]; then
            git add go.mod go.sum README.md
            git commit -m "chore(sync): sync upstream & bump mihomo backend to ${LATEST}"
          fi

          # 推送合并了上游代码或升级了 mihomo 的主分支
          git push origin "HEAD:${GITHUB_REF_NAME}"

          # 若同名 tag 已存在则追加短提交号避免冲突
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="${TAG_NAME}-${SHORT_SHA}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Cross-compile all platforms & package archives
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.tag_name }}"
          mkdir -p dist/release

          targets=(
            "windows amd64 .exe"
            "windows arm64 .exe"
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for t in "${targets[@]}"; do
            read -r goos goarch ext <<<"$t"
            bin_name="nekospeed-${goos}-${goarch}${ext:-}"
            out_bin="dist/${bin_name}"
            echo "==> Building ${out_bin}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X nekospeed/internal/runner.Version=${VERSION}" -o "$out_bin" ./cmd/nekospeed

            pkg_name="nekospeed_${VERSION}_${goos}-${goarch}"
            stage="dist/.stage/${pkg_name}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp "$out_bin" "$stage/"
            cp README.md LICENSE "$stage/"

            if [ "$goos" = "windows" ]; then
              (cd dist/.stage && zip -q -r "../release/${pkg_name}.zip" "${pkg_name}")
              cp "$out_bin" "dist/release/${bin_name}"
            else
              (cd dist/.stage && tar czf "../release/${pkg_name}.tar.gz" "${pkg_name}")
            fi
          done

          rm -rf dist/.stage

      - name: Build Android APK (arm64-v8a)
        if: steps.check.outputs.should_release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.tag_name }}"
          if [[ "$VERSION" == v* ]]; then
            VERSION_NAME="${VERSION#v}"
          else
            VERSION_NAME="0.3.0-${GITHUB_SHA:0:7}"
          fi
          VERSION_CODE=$(( 10#$(date -u +%y%m%d) * 1000 + (${GITHUB_RUN_NUMBER:-1} % 1000) ))

          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [ -z "$NDK_HOME" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            NDK_HOME=$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$NDK_HOME" ]; then
            echo "::error::Android NDK not found in runner environment"
            exit 1
          fi

          NDK_BIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC=""
          for api in 26 21; do
            if [ -x "${NDK_BIN}/aarch64-linux-android${api}-clang" ]; then
              CC="${NDK_BIN}/aarch64-linux-android${api}-clang"
              break
            fi
          done
          if [ -z "$CC" ]; then
            echo "::error::aarch64-linux-android26/21-clang not found in ${NDK_BIN}"
            exit 1
          fi

          echo "==> Using NDK CC: ${CC}"
          OUT_SO="android/app/src/main/jniLibs/arm64-v8a/libnekospeed.so"
          mkdir -p "$(dirname "$OUT_SO")"
          PAGE_FLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"

          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC="$CC" \
          CGO_LDFLAGS="$PAGE_FLAGS" \
            go build -trimpath \
              -ldflags "-s -w -linkmode=external -extldflags '${PAGE_FLAGS}' -X nekospeed/internal/runner.Version=${VERSION}" \
              -o "$OUT_SO" ./cmd/nekospeed

          ls -lh "$OUT_SO"
          python3 - "$OUT_SO" <<'PY'
          import subprocess, sys
          out = subprocess.check_output(["readelf", "-lW", sys.argv[1]], text=True)
          print(out)
          loads = []
          for line in out.splitlines():
              parts = line.split()
              if parts and parts[0] == "LOAD":
                  align = int(parts[-1], 16)
                  loads.append((line.strip(), align))
          assert loads, "No ELF LOAD segments found"
          bad = [(l, hex(a)) for l, a in loads if a < 0x4000]
          assert not bad, f"Unaligned ELF LOAD segments (< 0x4000): {bad}"
          print(f"Verified {len(loads)} ELF LOAD segments >= 0x4000 (16 KB)")
          PY

          FONT_DST="android/app/src/main/assets/fonts/NotoSansCJKsc-Regular.otf"
          mkdir -p "$(dirname "$FONT_DST")"
          if [ ! -f "$FONT_DST" ] || [ "$(wc -c < "$FONT_DST")" -le 5242880 ]; then
            curl -fsSL -o "$FONT_DST" \
              "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" \
            || curl -fsSL -o "$FONT_DST" \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          fi
          FONT_SIZE=$(wc -c < "$FONT_DST")
          echo "Bundled font size: ${FONT_SIZE} bytes"
          if [ "$FONT_SIZE" -le 5242880 ]; then
            echo "::error::NotoSansCJKsc-Regular.otf is unexpectedly small (${FONT_SIZE} bytes)"
            exit 1
          fi

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASS:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASS:-}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/release.keystore"
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
            if [ ! -s "$KEYSTORE_FILE" ]; then
              echo "::error::Decoded ANDROID_KEYSTORE_BASE64 is empty"
              exit 1
            fi
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$KEY_PASS"
            echo "::notice::Using configured release keystore for Android APK signing."
          else
            echo "::notice::ANDROID_KEYSTORE_* secrets not fully configured; Gradle will fall back to debug signing."
          fi

          echo "==> Building Android APK: versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"
          (
            cd android
            chmod +x gradlew
            ./gradlew testReleaseUnitTest assembleRelease \
              -PversionName="$VERSION_NAME" \
              -PversionCode="$VERSION_CODE" \
              --no-daemon
          )

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected release APK not found at ${APK_PATH}"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

          APKSIGNER=$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools/"
            exit 1
          fi
          echo "==> Verifying APK signature via ${APKSIGNER}"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

          mkdir -p dist/release
          cp "$APK_PATH" "dist/release/nekospeed_${VERSION}_android-arm64.apk"

      - name: Generate unified SHA256SUMS.txt
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          cd dist/release
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "NekoSpeed ${{ steps.tag.outputs.tag_name }} (mihomo ${{ steps.check.outputs.latest }})"
          generate_release_notes: true
          body: |
            ### 🚀 自动化同步与构建发布
            - **上游仓库同步**：已同步 [`KaWaIDeSuNe/NekoSpeed`](https://github.com/KaWaIDeSuNe/NekoSpeed) 最新提交（本次新增合并提交数：`${{ steps.check.outputs.upstream_commits }}`）
            - **Mihomo 内核版本**：[`${{ steps.check.outputs.latest }}`](https://github.com/MetaCubeX/mihomo/releases/tag/${{ steps.check.outputs.latest }})
            - **分支增强特性**：
              - 自动识别并绑定物理网卡（Windows `IP_UNICAST_IF` / macOS `IP_BOUND_IF`），绕过本地 Clash TUN 并防御 IPv4 (`198.18.0.0/15`) 与 IPv6 (`fc00::/7` / `2001:2::/48`) Fake-IP，支持 IPv6 节点预检兜底，防止代理套代理
              - 多库协同离线 GeoIP 引擎（`GeoCN.mmdb` + `ipinfo_lite.mmdb` / `GeoLite2-ASN.mmdb` + `GeoLite2-City.mmdb`），支持便携目录自动发现、并发更新校验与中文化地区/城市拓扑渲染
              - RFC 5780 STUN NAT 探测增强（优先使用支持 `OTHER-ADDRESS` 的标准服务器并直连解析绕过 Fake-IP，避免 NAT 类型误判）
              - 升级版内嵌 WebUI 控制台（环境与 GeoIP 状态浮层、智能粘贴识别、按需挑节点、实时单节点流式上屏与延迟/解锁可视化、免重测快速重绘、全宽报告画廊与同源安全防护）
              - Android 轻量 WebView 壳端（复用内嵌 WebUI、`jniLibs` W^X 兼容与 16 KB ELF 页对齐、`NekoAndroid` JS 桥接与前台服务保活，自动构建 `nekospeed_<tag>_android-arm64.apk`）
              - Windows 版支持直接双击 `nekospeed-windows-amd64.exe` 一键启动 WebUI (`http://127.0.0.1:18189`)
          files: dist/release/*
