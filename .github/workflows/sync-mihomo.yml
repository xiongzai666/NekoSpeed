name: Sync Upstream & Mihomo Auto Release

on:
  schedule:
    # 每天北京时间 10:00 (02:00 UTC) 自动检查上游 KaWaIDeSuNe/NekoSpeed 代码更新与 MetaCubeX/mihomo 新版本
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '即使上游与 mihomo 无更新也强制重新构建并发布 Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream KaWaIDeSuNe/NekoSpeed & check MetaCubeX/mihomo
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. 检查并同步上游仓库 KaWaIDeSuNe/NekoSpeed
          git remote add upstream https://github.com/KaWaIDeSuNe/NekoSpeed.git || true
          git fetch upstream main
          UPSTREAM_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "New commits in upstream KaWaIDeSuNe/NekoSpeed: $UPSTREAM_COUNT"
          UPSTREAM_UPDATED="false"
          if [ "$UPSTREAM_COUNT" -gt 0 ]; then
            echo "Merging $UPSTREAM_COUNT new commit(s) from upstream/main..."
            if ! git merge --no-edit upstream/main; then
              git merge --abort || true
              git push -f origin "upstream/main:refs/heads/sync/upstream-main"
              if [ "$(gh pr list --head sync/upstream-main --state open --json number --jq 'length')" = "0" ]; then
                gh pr create \
                  --head sync/upstream-main \
                  --base "${GITHUB_REF_NAME}" \
                  --title "chore(sync): manual conflict resolution needed for upstream/main" \
                  --body "Automatic merge of \`KaWaIDeSuNe/NekoSpeed\` (\`${UPSTREAM_COUNT}\` commit(s)) conflicted with fork changes. Refusing silent \`-X ours\` overwrite; please resolve conflicts manually." || true
              fi
              echo "::error::Upstream merge conflict detected; opened sync/upstream-main for manual review."
              exit 1
            fi
            UPSTREAM_UPDATED="true"
          fi
          echo "upstream_updated=$UPSTREAM_UPDATED" >> "$GITHUB_OUTPUT"
          echo "upstream_commits=$UPSTREAM_COUNT" >> "$GITHUB_OUTPUT"

          # 2. 检查上游 MetaCubeX/mihomo 最新稳定版 Release
          CURRENT=$(awk '/github.com\/metacubex\/mihomo / {print $2; exit}' go.mod)
          LATEST=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          echo "Current mihomo version in go.mod: $CURRENT"
          echo "Latest upstream mihomo release: $LATEST"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; then
            echo "needs_mihomo_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_mihomo_update=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$UPSTREAM_UPDATED" = "true" ] || { [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; } || [ "$FORCE_RELEASE" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check.outputs.should_release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install CJK Fonts for Render Tests
        if: steps.check.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk zip

      - name: Upgrade mihomo dependency to latest
        if: steps.check.outputs.needs_mihomo_update == 'true' || steps.check.outputs.upstream_updated == 'true'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          go get "github.com/metacubex/mihomo@${LATEST}"
          go mod tidy
          sed -i -E "s|github.com/metacubex/mihomo v[0-9.]+|github.com/metacubex/mihomo ${LATEST}|g" README.md || true

      - name: Run Unit Tests
        if: steps.check.outputs.should_release == 'true'
        run: go test -v ./...

      - name: Commit & Push synced changes and compute Release Tag
        id: tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          LATEST="${{ steps.check.outputs.latest }}"
          DATE_STAMP=$(date -u +'%Y.%m.%d')
          TAG_NAME="v${DATE_STAMP}-${LATEST}"

          if [ -n "$(git status --porcelain go.mod go.sum README.md)" ]; then
            git add go.mod go.sum README.md
            git commit -m "chore(sync): sync upstream & bump mihomo backend to ${LATEST}"
          fi

          # 推送合并了上游代码或升级了 mihomo 的主分支
          git push origin "HEAD:${GITHUB_REF_NAME}"

          # 若同名 tag 已存在则追加短提交号避免冲突
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="${TAG_NAME}-${SHORT_SHA}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Cross-compile all platforms & package archives
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.tag_name }}"
          mkdir -p dist/release

          targets=(
            "windows amd64 .exe"
            "windows arm64 .exe"
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for t in "${targets[@]}"; do
            read -r goos goarch ext <<<"$t"
            bin_name="nekospeed-${goos}-${goarch}${ext:-}"
            out_bin="dist/${bin_name}"
            echo "==> Building ${out_bin}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X nekospeed/internal/runner.Version=${VERSION}" -o "$out_bin" ./cmd/nekospeed

            pkg_name="nekospeed_${VERSION}_${goos}-${goarch}"
            stage="dist/.stage/${pkg_name}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp "$out_bin" "$stage/"
            cp README.md LICENSE "$stage/"

            if [ "$goos" = "windows" ]; then
              (cd dist/.stage && zip -q -r "../release/${pkg_name}.zip" "${pkg_name}")
              cp "$out_bin" "dist/release/${bin_name}"
            else
              (cd dist/.stage && tar czf "../release/${pkg_name}.tar.gz" "${pkg_name}")
            fi
          done

          rm -rf dist/.stage
          (cd dist/release && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "NekoSpeed ${{ steps.tag.outputs.tag_name }} (mihomo ${{ steps.check.outputs.latest }})"
          generate_release_notes: true
          body: |
            ### 🚀 自动化同步与构建发布
            - **上游仓库同步**：已同步 [`KaWaIDeSuNe/NekoSpeed`](https://github.com/KaWaIDeSuNe/NekoSpeed) 最新提交（本次新增合并提交数：`${{ steps.check.outputs.upstream_commits }}`）
            - **Mihomo 内核版本**：[`${{ steps.check.outputs.latest }}`](https://github.com/MetaCubeX/mihomo/releases/tag/${{ steps.check.outputs.latest }})
            - **分支增强特性**：
              - 自动识别并绑定物理网卡（Windows `IP_UNICAST_IF` / macOS `IP_BOUND_IF`），自动绕过本地 Clash TUN 与 `198.18.0.0/15` Fake-IP，防止代理套代理
              - 极简双行 WebUI 控制台（支持按需挑节点、实时单节点流式上屏、免重测 0.3s 重绘主题/排序、一键复制图片到剪贴板、导出 CSV）
              - Windows 版支持直接双击 `nekospeed-windows-amd64.exe` 一键启动 WebUI (`http://127.0.0.1:18189`)
          files: dist/release/*
